<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app use the full iPhone screen; the CSS
         pads for the notch and home indicator with env(safe-area-inset-*).
         maximum-scale=1 stops iOS zooming in whenever a small input is tapped
         (it does this for any field under 16px) - which otherwise happened on
         every weight box, mid-set. iOS still allows pinch-zoom for access. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Home-screen install. iPhones read the apple-* tags and the touch icon
         (they ignore SVG icons); Android and desktop Chrome read the manifest. -->
    <meta name="apple-mobile-web-app-title" content="Trained.best" />
    <meta name="application-name" content="Trained.best" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Trained.best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Service worker: caches the app shell so the app still OPENS when the
         phone has no signal (see public/sw.js). Guarded three ways:
           * http/https only - inside the Capacitor app the page is served from
             capacitor://localhost, where registration throws and the native
             build already ships its assets on the device anyway.
           * registered on load, so it never competes with the first render.
           * the reload-on-update only fires if a worker was ALREADY in control.
             With skipWaiting + clients.claim the very first install also fires
             controllerchange, and reloading there would bounce the page on
             every athlete's first ever visit. -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        if (location.protocol !== "http:" && location.protocol !== "https:") return;

        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;

        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController || reloading) return;
          reloading = true;
          location.reload();
        });

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {
            /* Private mode, unsupported browser, or a bad response for sw.js.
               The app works fine without it - it just won't open offline. */
          });
        });
      })();
    </script>
  </body>
</html>
